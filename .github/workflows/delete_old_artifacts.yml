name: 'Delete old artifacts'
on:
  schedule:
    - cron: '0 04 * * *' # every day at 4am

permissions:
  actions: write
  contents: read

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than one day
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff="$(date -u -d '1 day ago' +'%Y-%m-%dT%H:%M:%SZ')"

          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"${cutoff}\") | .id" |
          while read -r artifact_id; do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
